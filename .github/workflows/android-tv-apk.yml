name: Build Swoop TV Google TV APK

on:
  workflow_dispatch:
    inputs:
      publish_downloader_release:
        description: 'Publish/update the stable Google TV test APK used by Downloader code 3682231'
        required: false
        default: true
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'swoop-tv-starmeter.json'
      - 'test-signing/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-tv-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate Swoop TV runtime-critical card rendering
        run: |
          node tests/card-runtime-smoke.mjs
          node tests/tv-ui-runtime-smoke.mjs

      - name: Build Google TV test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK and checksum
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Swoop-TV-v0.8.25-Google-TV-Test.apk
          cp Swoop-TV-v0.8.25-Google-TV-Test.apk Swoop-TV-v0.8.1-Google-TV-Test.apk
          sha256sum Swoop-TV-v0.8.25-Google-TV-Test.apk > Swoop-TV-v0.8.25-Google-TV-Test.apk.sha256
          sha256sum Swoop-TV-v0.8.1-Google-TV-Test.apk > Swoop-TV-v0.8.1-Google-TV-Test.apk.sha256
          cat > swoop-tv-latest.json <<EOF
          {"version":"0.8.25","versionCode":825,"updateUrl":"https://github.com/${GITHUB_REPOSITORY}/releases/download/google-tv-test-v0.8.1/Swoop-TV-v0.8.1-Google-TV-Test.apk","changes":["Adds IMDb STARmeter Top 100 with provider-matched person rails and hot-search caching.","Fixes long-rail 24→25 horizontal focus jumps and preserves visual column on Up/Down.","Expands the Home hero and standardises TV-safe rail insets.","Moves Live TV preview to the centre with contained branding on the right and larger channel tiles.","Adds episode air date/synopsis/runtime enrichment and larger Guide logos."]}
          EOF

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swoop-TV-v0.8.25-Google-TV-Test
          path: |
            Swoop-TV-v0.8.25-Google-TV-Test.apk
            Swoop-TV-v0.8.25-Google-TV-Test.apk.sha256
            Swoop-TV-v0.8.1-Google-TV-Test.apk
            Swoop-TV-v0.8.1-Google-TV-Test.apk.sha256
            swoop-tv-latest.json
            swoop-tv-starmeter.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Downloader test release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_downloader_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="google-tv-test-v0.8.1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Swoop TV Google TV Test" \
              --notes "Current hardware-test channel. Test-only signing identity; not a production release." \
              --prerelease
          else
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Swoop TV Google TV Test — current v0.8.25" \
              --notes "Current hardware-test channel. v0.8.25 adds STARmeter, fixes long-rail and vertical column navigation, expands the Home hero, rebalances Live TV preview/branding, enriches episode metadata and polishes Guide/poster presentation while retaining the v0.8.24 modal focus hotfix. Test-only signing identity; not a production release." \
              --prerelease
          fi
          gh release upload "$TAG" \
            Swoop-TV-v0.8.25-Google-TV-Test.apk \
            Swoop-TV-v0.8.25-Google-TV-Test.apk.sha256 \
            Swoop-TV-v0.8.1-Google-TV-Test.apk \
            Swoop-TV-v0.8.1-Google-TV-Test.apk.sha256 \
            swoop-tv-latest.json \
            swoop-tv-starmeter.json \
            --clobber
          echo "Downloader code 3682231 remains on the stable URL below:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Swoop-TV-v0.8.1-Google-TV-Test.apk" >> "$GITHUB_STEP_SUMMARY"
