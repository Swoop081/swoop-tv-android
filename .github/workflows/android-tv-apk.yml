name: Build Swoop TV Google TV APK

on:
  workflow_dispatch:
    inputs:
      publish_downloader_release:
        description: 'Publish/update the stable Google TV test APK used by Downloader code 3682231'
        required: false
        default: true
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'swoop-tv-starmeter.json'
      - 'swoop-tv-seed-cache.json'
      - 'RELEASE_NOTES.md'
      - 'TV_HARDWARE_TEST_CHECKLIST.md'
      - 'TV_HARDWARE_RUNNING_FIXES.md'
      - 'test-signing/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-tv-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Promote pending v0.8.33 source changes
        id: promote
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          python scripts/promote-v0833.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote v0.8.33 route top and pre-login STARmeter stability"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "v0.8.33 source promotion committed. The fresh push run will build and publish that promoted commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        if: ${{ steps.promote.outputs.changed != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ steps.promote.outputs.changed != 'true' }}
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        if: ${{ steps.promote.outputs.changed != 'true' }}
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        if: ${{ steps.promote.outputs.changed != 'true' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Refresh packaged warm-start seed cache
        if: ${{ steps.promote.outputs.changed != 'true' }}
        shell: bash
        run: |
          node scripts/refresh-seed-cache.mjs
          python -m json.tool app/src/main/assets/seed-cache.json >/dev/null
          python -m json.tool swoop-tv-seed-cache.json >/dev/null

      - name: Generate version and release metadata
        if: ${{ steps.promote.outputs.changed != 'true' }}
        id: meta
        run: node scripts/generate-build-metadata.mjs

      - name: Validate Swoop TV runtime, seed cache and hardware-test contracts
        if: ${{ steps.promote.outputs.changed != 'true' }}
        shell: bash
        run: |
          find app/src/main/assets -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/card-runtime-smoke.mjs
          node tests/tv-ui-runtime-smoke.mjs
          python -m json.tool app/src/main/assets/starmeter.json >/dev/null
          python -m json.tool swoop-tv-starmeter.json >/dev/null
          python -m json.tool swoop-tv-latest.json >/dev/null
          python -m json.tool app/src/main/assets/seed-cache.json >/dev/null
          python -m json.tool swoop-tv-seed-cache.json >/dev/null

      - name: Build Google TV test APK
        if: ${{ steps.promote.outputs.changed != 'true' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK and checksums
        if: ${{ steps.promote.outputs.changed != 'true' }}
        shell: bash
        env:
          VERSIONED_APK: ${{ steps.meta.outputs.versioned_apk }}
          STABLE_APK: ${{ steps.meta.outputs.stable_apk }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$VERSIONED_APK"
          cp "$VERSIONED_APK" "$STABLE_APK"
          sha256sum "$VERSIONED_APK" > "$VERSIONED_APK.sha256"
          sha256sum "$STABLE_APK" > "$STABLE_APK.sha256"

      - name: Upload Actions artifact
        if: ${{ steps.promote.outputs.changed != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Swoop-TV-v${{ steps.meta.outputs.version }}-Google-TV-Test
          path: |
            ${{ steps.meta.outputs.versioned_apk }}
            ${{ steps.meta.outputs.versioned_apk }}.sha256
            ${{ steps.meta.outputs.stable_apk }}
            ${{ steps.meta.outputs.stable_apk }}.sha256
            swoop-tv-latest.json
            swoop-tv-starmeter.json
            swoop-tv-seed-cache.json
            build-metadata.json
            release-summary.md
            TV_HARDWARE_TEST_CHECKLIST.md
            TV_HARDWARE_RUNNING_FIXES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish Downloader test release
        if: ${{ steps.promote.outputs.changed != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_downloader_release)) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSIONED_APK: ${{ steps.meta.outputs.versioned_apk }}
          STABLE_APK: ${{ steps.meta.outputs.stable_apk }}
        run: |
          set -euo pipefail
          TAG="google-tv-test-v0.8.1"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Swoop TV Google TV Test — current v${VERSION}" \
              --notes-file release-summary.md \
              --prerelease
          else
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Swoop TV Google TV Test — current v${VERSION}" \
              --notes-file release-summary.md \
              --prerelease
          fi

          upload_retry() {
            local file="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "Uploading ${file} (attempt ${attempt}/3)..."
              if timeout 120s gh release upload "$TAG" "$file" --clobber; then
                return 0
              fi
              echo "Upload attempt ${attempt} failed or timed out for ${file}."
              sleep $((attempt * 5))
            done
            echo "Failed to upload ${file} after 3 attempts."
            return 1
          }

          # Downloader code 3682231 uses this fixed-name asset. Publish it first
          # so a successful build becomes available to the TV before archival data.
          upload_retry "$STABLE_APK"
          upload_retry "$STABLE_APK.sha256"
          upload_retry swoop-tv-latest.json

          # Verify that GitHub has fully committed the stable APK, rather than
          # leaving an incomplete release asset in the transient 'starter' state.
          STABLE_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq ".assets[] | select(.name == \"${STABLE_APK}\") | .state" | tail -n1)
          if [ "$STABLE_STATE" != "uploaded" ]; then
            echo "Stable Downloader APK is not fully uploaded (state=${STABLE_STATE:-missing})."
            exit 1
          fi

          # Versioned/archive assets are secondary and can follow once Downloader
          # already has a verified current APK.
          upload_retry "$VERSIONED_APK"
          upload_retry "$VERSIONED_APK.sha256"
          upload_retry swoop-tv-starmeter.json
          upload_retry swoop-tv-seed-cache.json
          upload_retry TV_HARDWARE_TEST_CHECKLIST.md

          echo "Downloader code 3682231 updated and verified:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${STABLE_APK}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable APK release state: ${STABLE_STATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hardware test checklist and generated release metadata are attached to this workflow artifact." >> "$GITHUB_STEP_SUMMARY"
